# dev: the 3.0.1 development build. Everything the launcher used to set in 30 lines of a .cmd file.
[run]
exe = xc2/build/301/boot/xc2_boot.exe
cwd = xc2/build/boot
gfx = window
link = host
exefs = xc2/game/xc2ns301
romfs = xc2/build/boot/game/romfs-301
dlc = xc2/build/boot/game/dlc-301
save = work/save-301
shader_cache = xc2/build/boot/shader_cache/spirv
missing = work/missing-301
logs = work/logs
fps = 60
hz = 60

[env]
NXRT_NVN_DS_DEBUG = 1
NXRT_SYSTEM_LANGUAGE = zh-Hans
