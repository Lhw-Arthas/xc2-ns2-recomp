name: Bug report
description: Something is wrong with the emulator, a build step or a tool
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Quick checks before submitting:**
        - Update to the [latest release](https://github.com/weile10000/xc2-ns2-recomp/releases/latest) first (**About → Check now** in the launcher).
        - Common non-bugs: NVIDIA App global DLSS model M/L override causes horizontal black lines; Switch 1 mods/cheats are not directly compatible with Switch 2 3.0.1. ([Known issues](https://github.com/weile10000/xc2-ns2-recomp/blob/main/docs/COMPATIBILITY.md))

        **提交前请顺手确认：** 先在启动器 **关于 → 检查更新** 升级到最新版；N 卡横条黑线通常是 NVIDIA App 全局强开了 DLSS 模型 M/L 覆盖；NS1 模组/金手指与 NS2 3.0.1 不直接通用。
  - type: input
    id: build
    attributes:
      label: Build (optional)
      description: Release tag or commit you ran; the report zip carries it too.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Native Windows 11 x64 is the primary target covered by release testing. Windows 10 x64 and Linux / SteamOS (Proton / Wine) receive best-effort compatibility without guaranteed full regression support — community PRs and forks are welcome.
      options:
        - "Windows 11 x64 (primary target)"
        - "Windows 10 x64 (best-effort compatibility)"
        - "Linux / SteamOS / Proton / Wine (best-effort compatibility)"
        - "Other (community / fork)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, driver and OS build version
      description: The report zip already records GPU/driver; please also confirm your OS build (e.g. `winver` or distro/Proton version).
      placeholder: RX 6800 XT, Adrenalin 26.10.1, Windows 11 26200
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and where in the game.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report zip
      description: |
        For anything about what the game draws, use the launcher: **Play -> Record a report** (or **About -> Record a report**). It starts the game with diagnostics on, and closing the window writes the zip. From a command prompt the same thing is:

        ```
        tools\python\python.exe tools\report.py
        ```

        Play until the problem shows, then close the game. It writes
        `work\reports\report-<timestamp>.zip`; attach that file. Add `-Headless` if you also want a
        frame-time CSV.

        The zip holds the validation layer's messages, the capability lines your driver reports, whether
        the device was lost, your settings and the full log. Nothing in it is game data.

        For a build-step or tooling bug, a log from `work\logs\` or `setup.log` is enough.
      placeholder: report-20261124-120000.zip
    validations:
      required: true
  - type: dropdown
    id: upscaler
    attributes:
      label: Does it also happen on default TAAU (Frame Gen off)? (optional)
      description: Optional — switch Upscaler to built-in TAAU and turn Frame Generation off, restart, and try the same spot.
      options:
        - "Not tried"
        - "Yes, it happens on TAAU (FG off) too"
        - "No, only with FSR / DLSS / Frame Gen"
  - type: checkboxes
    id: custom_env
    attributes:
      label: Custom setup or external tweaks (optional — check any that apply)
      description: Helps us narrow things down quickly. If any of these are active, trying once with defaults often rules out external conflicts.
      options:
        - label: GPU driver overrides active (e.g. NVIDIA App DLSS model override, Low Latency Ultra)
          required: false
        - label: Mods or cheats enabled
          required: false
        - label: Third-party overlay (RTSS / ReShade), custom CPU affinity, or manual `nxrt.ini` edits
          required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This repository contains no game files, and I have not attached any.
          required: true
