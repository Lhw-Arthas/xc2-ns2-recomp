name: Compatibility report
description: This game area runs (or does not run) on your hardware
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        **If you are on an older build, update first.** Releases before 0.2.0 have problems that are already fixed
        (720p internal render, the add-on `0/romfs` layout, the film hand-back, F1 not opening the settings page).
        Latest: <https://github.com/weile10000/xc2-ns2-recomp/releases/latest>

        **报 issue 前请先确认版本是 0.2.0 或更新**，旧版本的问题有几条已经修掉了。
  - type: input
    id: area
    attributes:
      label: Game area / chapter
      placeholder: Gormott, the open plain after the first camp
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
    validations:
      required: true
  - type: input
    id: hw
    attributes:
      label: CPU / GPU / driver / RAM
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Frame rate
      description: The "hitch: N frames in 10 s: mean X fps, 1% low Y" line from the log is ideal.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Perfect
        - Playable
        - Runs with glitches
        - Loads but unplayable
        - Does not load
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Settings that mattered, glitches, anything that would save the next person time.
