name: Feature request
description: Something the emulator or the toolchain should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **If you are on an older build, update first.** Releases before 0.2.0 have problems that are already fixed
        (720p internal render, the add-on `0/romfs` layout, the film hand-back, F1 not opening the settings page).
        Latest: <https://github.com/weile10000/xc2-ns2-recomp/releases/latest>

        **报 issue 前请先确认版本是 0.2.0 或更新**，旧版本的问题有几条已经修掉了。
  - type: textarea
    id: what
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is useful
      description: Who hits this, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you would do it (optional)
      description: Pointers into the code are welcome.
