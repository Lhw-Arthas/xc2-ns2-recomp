name: Feature request
description: Something the emulator or the toolchain should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Please check the [latest release](https://github.com/weile10000/xc2-ns2-recomp/releases/latest) first** — your idea may already be in recent builds.
        **提交前请先确认最新版是否已包含该功能。**
  - type: textarea
    id: what
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is useful
      description: Who hits this, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you would do it (optional)
      description: Pointers into the code are welcome.
