name: Slow or stuttering
description: Low frame rate, or hitches, in a place that runs fine elsewhere
labels: [performance]
body:
  - type: markdown
    attributes:
      value: |
        **Please make sure you are on the latest release** (Launcher: **About → Check now**, or <https://github.com/weile10000/xc2-ns2-recomp/releases/latest>).
        **请先确认已升级到最新版**（启动器 **关于 → 检查更新**）。

        The report zip carries the frame times, what grew during a slow frame, and whether a cutscene had just ended. Without it a stutter report can only be guessed at.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Native Windows 11 x64 is the primary target covered by release testing. Windows 10 x64 and Linux / SteamOS (Proton / Wine) receive best-effort compatibility without guaranteed full regression support — community PRs and forks are welcome.
      options:
        - "Windows 11 x64 (primary target)"
        - "Windows 10 x64 (best-effort compatibility)"
        - "Linux / SteamOS / Proton / Wine (best-effort compatibility)"
        - "Other (community / fork)"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: Chapter and area, plus what you were doing. "Chapter 1, the field after the first camp, walking" is enough.
      placeholder: Chapter 1, field after the first camp, walking around
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: Report zip
      description: |
        Open a command prompt in the folder you unzipped and run:

        ```
        tools\python\python.exe tools\report.py --no-validation
        ```

        Play until it goes slow, keep going for a few seconds of the slow part, then close the game. It writes
        `work\reports\report-<stamp>.zip` - attach that file. Nothing in it is game data.
      placeholder: report-20261124-120000.zip
    validations:
      required: true
  - type: dropdown
    id: recovery
    attributes:
      label: What it does
      options:
        - It recovers by itself after a while
        - It stays slow until I reload
        - Only the first time I come here
        - Every time
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build (optional)
      description: The report zip already says it; fill this in if you know it.
      placeholder: latest (e.g. v0.2.6)
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: |
        What you saw, the upscaler and "Lock render resolution" if you changed them, and whether the game had just
        played a cutscene when it started. A screenshot is welcome here.
  - type: checkboxes
    id: custom_env
    attributes:
      label: Custom setup or external tweaks (optional — check any that apply)
      description: Helps us spot external bottlenecks quickly (e.g. driver Low Latency Ultra, CPU core pinning, or FIFO VSync).
      options:
        - label: GPU driver overrides active (e.g. Low Latency Ultra, DLSS model override)
          required: false
        - label: Custom CPU affinity / core pinning, or third-party overlay (RTSS / ReShade)
          required: false
        - label: Mods / cheats enabled, or manual `nxrt.ini` edits
          required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I attached no game files.
          required: true
