name: Build & Package Self-Contained Toolchain

on:
  workflow_dispatch:
    inputs:
      astc2bc7:
        description: "构建 ASTC→BC7 转码器（取消勾选则传 -DNXRT_ASTC2BC7=OFF 跳过）"
        type: boolean
        default: true
      llvm_version:
        description: "LLVM/clang-cl 版本"
        type: string
        default: "18.1.8"
      vulkan_sdk_version:
        description: "Vulkan SDK 版本（必须带 .0 后缀）"
        type: string
        default: "1.4.363.0"
      retention_days:
        description: "Artifact 保留天数"
        type: number
        default: 7
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    env:
      TOOLCHAIN_ROOT: ${{ github.workspace }}\toolchain
      LLVM_VERSION: ${{ inputs.llvm_version || '18.1.8' }}
      VULKAN_SDK_VERSION: ${{ inputs.vulkan_sdk_version || '1.4.363.0' }}
      ASTC2BC7: ${{ inputs.astc2bc7 == false && 'OFF' || 'ON' }}
      RETENTION_DAYS: ${{ inputs.retention_days || 7 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 如果 third_party/nxrecomp 用 Git LFS 存二进制，取消下行注释
          # lfs: true

      # ---------- 1. 准备 MSVC (Build Tools) ----------
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- 2. 安装构建前置工具（winflexbison3 + ninja） ----------
      - name: Install build prerequisites (winflexbison3 / ninja)
        shell: pwsh
        run: |
          # gnuwin32 在 Chocolatey 已下架，改用 winflexbison3
          choco install winflexbison3 ninja -y --no-progress --limitoutput

          # 确保 bison / flex 命令可用（winflexbison3 默认提供的是 win_bison / win_flex）
          $chocoBin = "C:\ProgramData\chocolatey\bin"
          if (Test-Path "$chocoBin\win_bison.exe") {
            Copy-Item "$chocoBin\win_bison.exe" "$chocoBin\bison.exe" -Force
          }
          if (Test-Path "$chocoBin\win_flex.exe") {
            Copy-Item "$chocoBin\win_flex.exe" "$chocoBin\flex.exe" -Force
          }

          # 验证
          bison --version
          flex --version
          ninja --version

      # ---------- 3. 下载并解压 LLVM/clang-cl 到 toolchain/llvm ----------
      - name: Download LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-win64.exe"
          $out = "$env:RUNNER_TEMP\llvm-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList "/S", "/D=$env:TOOLCHAIN_ROOT\llvm" -Wait
          echo "$env:TOOLCHAIN_ROOT\llvm\bin" >> $env:GITHUB_PATH

      # ---------- 4. 下载并解压 Vulkan SDK 到 toolchain/vulkan ----------
      - name: Download Vulkan SDK ${{ env.VULKAN_SDK_VERSION }}
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          $out = "$env:RUNNER_TEMP\vulkan-installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -FilePath $out -ArgumentList `
            "--accept-licenses", "--default-answer", "--confirm-command", "install", `
            "--root", "$env:TOOLCHAIN_ROOT\vulkan" -Wait
          echo "$env:TOOLCHAIN_ROOT\vulkan\Bin" >> $env:GITHUB_PATH
          echo "VULKAN_SDK=$env:TOOLCHAIN_ROOT\vulkan" >> $env:GITHUB_ENV

      # ---------- 5. 安装 .NET 10 SDK ----------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ---------- 6. 安装 Python 3.12 + lz4/capstone ----------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone==5.0.9

      # ---------- 7. 获取并构建 ASTC 转码器（ISPC） ----------
      - name: Fetch and build ASTC transcoder (ISPC)
        if: ${{ env.ASTC2BC7 == 'ON' }}
        shell: pwsh
        run: |
          $repo   = "third_party\fefw-recomp"
          $script = Join-Path $repo "tools\textures\scripts\fetch_third_party.ps1"
          if (-not (Test-Path $script)) {
            throw "未找到 $script，请检查仓库目录结构是否完整"
          }
          Push-Location $repo
          try {
            & "tools\textures\scripts\fetch_third_party.ps1"
          } finally {
            Pop-Location
          }
          $outDir = Join-Path $repo "tools\textures\build\release"
          if (Test-Path $outDir) {
            Write-Host "ASTC transcoder 输出目录内容："
            Get-ChildItem -Recurse -File $outDir | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Warning "未找到 $outDir，CMake 可能仍会报 no ASTC transcoder"
          }

      # ---------- 8. 配置并构建 runtime ----------
      - name: Configure runtime
        shell: pwsh
        run: |
          $astcFlag = @()
          if ("${{ env.ASTC2BC7 }}" -eq "OFF") { $astcFlag += "-DNXRT_ASTC2BC7=OFF" }

          cmake -S third_party/fefw-recomp/runtime `
                -B third_party/fefw-recomp/build/runtime-gfx `
                -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DNXRT_BUILD_GFX=ON `
                -DNXRT_BUILD_GAMES=OFF `
                -DNXRT_BUILD_TESTS=OFF `
                @astcFlag `
                -DCMAKE_C_COMPILER=clang-cl `
                -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build runtime
        shell: pwsh
        run: |
          cmake --build third_party/fefw-recomp/build/runtime-gfx --target nxrt nxrt_gfx

      # ---------- 9. 组装自包含包 ----------
      - name: Assemble self-contained package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\xc2-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Recurse -Path "$env:TOOLCHAIN_ROOT\*" -Destination "$stage\toolchain"
          Copy-Item -Recurse -Path "third_party" -Destination "$stage\src"
          Copy-Item -Recurse -Path "docs" -Destination "$stage\src"
          Copy-Item -Recurse -Path "xc2" -Destination "$stage\src"
          Copy-Item -Path "*.md" -Destination "$stage\src"
          Copy-Item -Recurse -Path "third_party\fefw-recomp\build\runtime-gfx" -Destination "$stage\src\build"

          @"
          `$env:PATH = "$stage\toolchain\llvm\bin;$stage\toolchain\vulkan\Bin;`$env:PATH"
          `$env:VULKAN_SDK = "$stage\toolchain\vulkan"
          `$env:XC2_ENV = "$stage\src\toolchain\env.ps1"
          Write-Host "Toolchain activated. LLVM: `$(clang-cl --version | Select-Object -First 1)"
          "@ | Out-File -FilePath "$stage\activate.ps1" -Encoding utf8

          Compress-Archive -Path "$stage\*" -DestinationPath "$env:RUNNER_TEMP\xc2-ns2-recomp-selfcontained.zip" -Force

      # ---------- 10. 上传产物 ----------
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: xc2-ns2-recomp-selfcontained
          path: ${{ runner.temp }}\xc2-ns2-recomp-selfcontained.zip
          retention-days: ${{ env.RETENTION_DAYS }}
