name: repository checks

on:
  push:
  pull_request:

jobs:
  tree-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: No game data, keys or builds in the tree
        run: |
          set -eu
          bad=$(git ls-files | grep -Ei '\.(nsp|xci|nca|nup|ard|arh|nro|nso|kef|kips|keys)$|(^|/)prod\.keys$|(^|/)romfs/' || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"; echo "$bad"; exit 1
          fi
          echo "ok: no game data"
      - name: Notices are present
        run: |
          set -eu
          for f in LICENSE THIRD_PARTY_NOTICES.md docs/INVARIANTS.md \
                   third_party/fefw-recomp/MODIFICATIONS.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q nxnative THIRD_PARTY_NOTICES.md
          echo "ok: notices"
      - name: The settings reference matches its table
        run: |
          set -eu
          python3 tools/ci/config_table.py --check
          python3 tools/ci/check_play_settings.py
          python3 tools/ci/check_install_template.py

      - name: No personal paths
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git rev-parse --verify -q HEAD^1 >/dev/null; then
              base=HEAD^1
            else
              git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
              base=FETCH_HEAD
            fi
            mapfile -d '' -t files < <(git diff --name-only -z --diff-filter=ACMRT "$base" HEAD -- . ':!.github/workflows/ci.yml' ':!tools/ci/check_invariants.py' ':!tools/tests/test_tools_ci.py' ':!third_party/')
            if [ "${#files[@]}" -eq 0 ]; then
              echo "ok: no personal paths (no added or modified files in PR)"
              exit 0
            fi
            if git grep -n -I -E '[A-Za-z]:\\Users\\[A-Za-z0-9._-]+|[A-Za-z]:\\(XC2|Tools)([-\\/]|$)|sync-to-nas' -- "${files[@]}"; then
              echo "a personal or maintainer path is in the PR"; exit 1
            fi
            if git grep -n -I -F 'Xenoblade 2 Switch 2 Edition recomp' -- "${files[@]}"; then
              echo "the maintainer's absolute checkout path is in the PR"; exit 1
            fi
          else
            # a real user profile or maintainer workspace drive, anywhere outside guard/test fixtures
            if git grep -n -I -E '[A-Za-z]:\\Users\\[A-Za-z0-9._-]+|[A-Za-z]:\\(XC2|Tools)([-\\/]|$)|sync-to-nas' -- . ':!.github/workflows/ci.yml' ':!tools/ci/check_invariants.py' ':!tools/tests/test_tools_ci.py' ':!third_party/'; then
              echo "a personal or maintainer path is in the tree"; exit 1
            fi
            # the maintainer's own checkout, hardcoded into a script or a source file
            if git grep -n -I -F 'Xenoblade 2 Switch 2 Edition recomp' -- . ':!.github/workflows/ci.yml' ':!tools/ci/check_invariants.py'; then
              echo "the maintainer's absolute checkout path is in the tree"; exit 1
            fi
          fi
          echo "ok: no personal paths"
      - name: Markdown links resolve
        run: |
          set -eu
          python3 tools/ci/check_links.py

      - name: No private path is tracked
        run: |
          set -eu
          # docs/internal, work/, xc2/game and xc2/build hold the working notes, the build scratch and the
          # player's own dump. They are git-ignored and a local hook refuses them; this is the third layer,
          # for the case where something is committed with --no-verify or from another machine.
          bad=$(git ls-files | grep -E '^(docs/internal/|work/|xc2/game/|xc2/build/)' || true)
          if [ -n "$bad" ]; then
            echo "these paths must never be published:"; echo "$bad"; exit 1
          fi
          python3 tools/ci/check_invariants.py --hook

      - name: Run Python tool unit tests
        run: |
          set -eu
          python3 -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: No loose ExeFS under xc2/game
        run: |
          set -eu
          # the ExeFS modules have no extension, so the extension list above cannot see them
          bad=$(git ls-files 'xc2/game/**' || true)
          if [ -n "$bad" ]; then
            echo "game files under xc2/game:"; echo "$bad"; exit 1
          fi
          echo "ok: no game files"
